name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint (clj-kondo + cljfmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          lein: latest

      - name: Cache Maven deps
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('project.clj') }}
          restore-keys: ${{ runner.os }}-m2-

      # Both linters are clean; either one finding something fails the build.
      - run: lein lint

      # src/ is fully type-hinted. A reflective call is both a silent performance
      # cost and, as several fixed bugs showed, a way for a wrong Java signature
      # to compile and only fail at runtime.
      - name: No reflection warnings
        run: |
          set -o pipefail
          lein check 2>&1 | tee check.log
          if grep -q 'Reflection warning' check.log; then
            echo "::error::reflection warnings found — add type hints"
            grep 'Reflection warning' check.log
            exit 1
          fi

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          lein: latest

      - name: Cache Maven deps
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('project.clj') }}
          restore-keys: ${{ runner.os }}-m2-

      - run: lein test
